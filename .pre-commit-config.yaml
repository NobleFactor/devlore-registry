#
# Pre-commit hooks for devlore-registry
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# Full schema validation runs in CI via: star registry validate

repos:
  - repo: local
    hooks:
      - id: build-index
        name: Check knowledge index.yaml files
        entry: scripts/Build-Index
        language: script
        files: ^knowledge/
        pass_filenames: false
        stages: [pre-commit]
