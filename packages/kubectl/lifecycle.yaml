name: kubectl
version: "1.32.0"
description: Kubernetes command-line tool for cluster management
homepage: https://kubernetes.io/docs/reference/kubectl/
repository: https://github.com/kubernetes/kubectl
license: Apache-2.0
maintainer: Noble Factor

aliases:
  - kubernetes cli
  - k8s cli
  - k8s
  - kube

signatures:
  brew: [kubernetes-cli, kubectl]
  apt: [kubectl]
  dnf: [kubectl]
  pacman: [kubectl]
  choco: [kubernetes-cli]
  winget: [Kubernetes.kubectl]

platforms:
  - Darwin
  - Linux
  - Windows

features:
  completions:
    description: Install shell completions for bash/zsh/fish
    default: true
  krew:
    description: Install krew plugin manager
    default: false
  kubelogin:
    description: Install Azure AD kubelogin plugin
    default: false
  aws-iam-authenticator:
    description: Install AWS IAM authenticator for EKS
    default: false

settings:
  version:
    description: Specific kubectl version to install (e.g., "1.31.0")
    type: string
    default: ""

verification:
  command: "kubectl version --client"
  pattern: "Client Version.*v\\d+\\.\\d+\\.\\d+"

tags:
  - kubernetes
  - k8s
  - cloud
  - containers
  - devops
  - cli
