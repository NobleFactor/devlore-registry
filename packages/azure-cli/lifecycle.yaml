#
# azure-cli - Package Lifecycle Manifest
# Azure Command Line Interface
#
# Reference: https://learn.microsoft.com/en-us/cli/azure/install-azure-cli

name: azure-cli
version: "2.81.0"
description: Azure Command Line Interface for managing Azure resources
homepage: https://learn.microsoft.com/en-us/cli/azure/
repository: https://github.com/Azure/azure-cli
license: MIT

# Upstream release artifacts — for verification, direct download, bundling
# Hashes computed 2026-01-12
sources:
  - url: "https://aka.ms/installazureclidarwin"
    sha256: "633393b37776f8babdf6ea9a427ecd842574aca2fc0131137350a7943c0c2f2f"
    platform: darwin
    # Note: Install script, downloads and installs CLI

  - url: "https://azcliprod.blob.core.windows.net/msi/azure-cli-2.81.0-x64.msi"
    sha256: "00cd75d65f599e183a94b55cc6557a6a008425ca6c490d5d1d6208fe742c3f57"
    platform: windows
    arch: amd64

  # Linux: Uses apt/dnf repository scripts, not direct downloads

# Package manager availability — for ensure/batch operations
packages:
  brew: azure-cli
  port: azure-cli
  apt: azure-cli        # via packages.microsoft.com repo
  dnf: azure-cli        # via packages.microsoft.com repo
  choco: azure-cli
  winget: Microsoft.AzureCLI

authors:
  - name: Microsoft Corporation
    url: https://microsoft.com

platforms:
  - darwin
  - linux/debian
  - linux/ubuntu
  - linux/fedora
  - linux/rhel
  - windows

# Features enable optional capabilities
features:
  completions:
    description: Install shell completions for bash/zsh/fish
    default: true
  extensions:
    description: Install common Azure CLI extensions
    default: false

# Settings configure behavior
settings:
  telemetry:
    description: Enable/disable telemetry collection
    type: boolean
    default: true

# Dependencies that must be installed first
dependencies:
  - curl
  - gnupg

# Packages that conflict (must be removed)
conflicts: []

# Phase scripts
phases:
  prepare: prepare.star
  install: install.star
  provision: provision.star
  verify: verify.star

# Verification command
verification:
  command: "az --version"
  pattern: "azure-cli\\s+\\d+\\.\\d+\\.\\d+"

# Tags for search
tags:
  - cloud
  - azure
  - microsoft
  - cli
  - devops
