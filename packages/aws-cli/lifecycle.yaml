name: aws-cli
version: "2.22.0"
description: AWS Command Line Interface for managing AWS services
homepage: https://aws.amazon.com/cli/
repository: https://github.com/aws/aws-cli
license: Apache-2.0
maintainer: Noble Factor

aliases:
  - aws
  - awscli
  - amazon cli

signatures:
  brew: [awscli]
  choco: [awscli]
  winget: [Amazon.AWSCLI]

platforms:
  - Darwin
  - Linux
  - Windows

conflicts:
  - awscli  # v1 conflicts with v2

features:
  completions:
    description: Install shell completions for bash/zsh
    default: true
  session-manager:
    description: Install Session Manager plugin for EC2 access
    default: false

settings:
  output:
    description: Default output format (json, yaml, text, table)
    type: string
    default: json
  region:
    description: Default AWS region
    type: string
    default: ""

verification:
  command: "aws --version"
  pattern: "aws-cli/2\\.\\d+\\.\\d+"

tags:
  - cloud
  - aws
  - amazon
  - cli
  - devops
