name: docker
version: "28.0.1"
description: A container runtime — Docker CE on Linux, Colima on macOS
homepage: https://docs.docker.com/engine/install/
repository: https://github.com/moby/moby
license: Apache-2.0
maintainer: Noble Factor

aliases:
  - colima
  - container runtime
  - docker
  - docker ce
  - docker cli
  - docker engine

# Darwin resolves through whichever manager the platform router selects. MacPorts and Homebrew both
# carry colima and the docker CLI, and the package deliberately names neither: manager preference is
# machine policy, not a property of this package.
signatures:
  brew: [colima, docker]
  port: [colima, docker]
  apt: [docker-ce, docker-ce-cli]

# Linux.Debian returns once its phases are rewritten. Linux.Fedora is absent because the platform
# router wires no dnf leaf, and Windows because no source script covers it.
platforms:
  - Darwin

provides:
  - docker
  - docker-compose

features:
  purge-data:
    description: Remove all Docker data (images, containers, volumes) during decommission
    default: false

verification:
  command: docker --version
  pattern: "Docker version \\d+\\.\\d+"

notes: |
  WHY COLIMA ON macOS

  Licensing, and only licensing. Docker Desktop requires a paid subscription for organizations
  above 250 employees or $10M revenue, and OrbStack has a paid commercial tier. Colima is
  Apache-2.0 with no threshold, which matters doubly for a package shipped to customers: a Darwin
  package built on Docker Desktop hands every customer a licence obligation that scales with their
  headcount.

  Colima is also far easier to automate — a scriptable `colima start` against a DMG, an installer
  needing --accept-license, and a GUI launch. That is a consequence of the choice, not the reason
  for it.

  THIS PACKAGE ENSURES A RUNTIME EXISTS; IT DOES NOT INSTALL COLIMA

  Deploy installs Colima only when no container runtime is already present. An existing OrbStack or
  Docker Desktop is left exactly as found — the goal is to avoid putting a licensed product on a
  machine, not to displace one someone chose. Decommission is asymmetric for the same reason: it
  removes what deploy installed and nothing else, which falls out of the receipt boundary rather
  than needing a feature flag.

tags:
  - container
  - devops
  - docker
