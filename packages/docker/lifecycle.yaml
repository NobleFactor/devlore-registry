#
# lifecycle.yaml — Package Lifecycle Manifest for Docker
#
# Usage:
#   lore deploy docker
#   lore deploy docker --with rootless
#
# Phase scripts are in Linux.Debian/Deploy/

name: docker
version: "28.0.1"
description: Docker CE, CLI, containerd, buildx, and compose plugin
homepage: https://docs.docker.com/engine/install/
repository: https://github.com/moby/moby
license: Apache-2.0
maintainer: Noble Factor

aliases:
  - docker ce
  - docker engine
  - docker cli
  - containerd
  - docker-compose
  - docker compose
  - container runtime

platforms:
  - Darwin
  - Linux
  - Windows

provides:
  - docker
  - docker-compose
  - containerd

conflicts:
  - docker.io
  - docker-doc
  - docker-compose
  - docker-compose-v2
  - podman-docker
  - containerd
  - runc

features:
  rootless:
    description: Run Docker daemon without root privileges
    default: false
  purge-data:
    description: Remove all Docker data (images, containers, volumes) during decommission
    default: false

settings:
  storage-driver:
    description: Storage driver for Docker
    type: string
    default: overlay2
    values: [overlay2, btrfs, zfs, vfs]

  log-driver:
    description: Default logging driver
    type: string
    default: json-file
    values: [json-file, syslog, journald, none]

verification:
  command: docker --version
  pattern: "Docker version \\d+\\.\\d+"

hardware_provisions:
  ODROID-C4:
    description: Requires cgroup v1 compatibility mode
    reference: https://sipfront.com/blog/2024/01/running-docker-on-odroid-c4/
    boot_arg: systemd.unified_cgroup_hierarchy=0
  ODROID-C5:
    description: Requires cgroup v1 compatibility mode
    boot_arg: systemd.unified_cgroup_hierarchy=0

notes: |
  PLATFORM DIFFERENCES:
  - Linux: Docker CE (open source, Apache 2.0 license)
  - Darwin/Windows: Docker Desktop (proprietary, requires paid subscription for
    enterprises with >250 employees or >$10M annual revenue)

  LINUX:
  - Docker CE installation requires removing conflicting system packages first.
  - On ODROID C4/C5 boards, cgroup v1 compatibility mode must be enabled in boot.ini.
  - User should be added to the docker group to avoid requiring sudo for every command.

  DARWIN:
  - Requires macOS current or two previous major versions.
  - Rosetta 2 recommended for Apple Silicon.
  - Docker Desktop is installed to /Applications/Docker.app.

  WINDOWS:
  - Requires Windows 10/11 Pro, Enterprise, or Education (Home only supports Linux containers).
  - WSL 2 backend recommended (requires WSL version 2.1.5+).
  - User must be added to docker-users group.

tags:
  - container
  - docker
  - devops
