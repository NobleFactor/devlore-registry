name: xcode-clt
version: "16.0"
description: Xcode Command Line Tools - compilers and build tools for macOS
homepage: https://developer.apple.com/xcode/
license: Apple EULA
maintainer: Noble Factor

aliases:
  - xcode command line tools
  - xcode cli
  - apple developer tools
  - clang
  - macos sdk
  - apple clang

# No package manager signatures - CLT is installed via softwareupdate
# This is foundational; Homebrew depends on it but cannot install it
signatures: {}

platforms:
  - Darwin

features:
  rosetta:
    description: Install Rosetta 2 for x86_64 emulation (Apple Silicon only)
    default: false

  verify-full:
    description: Run comprehensive verification including test compilation
    default: true

settings:
  allow_xcode_fallback:
    description: Allow using full Xcode.app if installed instead of standalone CLT
    type: string
    default: "true"
    values: ["true", "false"]

  force_reinstall:
    description: Force reinstall even if already installed at correct version
    type: string
    default: "false"
    values: ["true", "false"]

verification:
  command: "clang --version"
  pattern: "Apple clang version \\d+"

notes: |
  TRIBAL KNOWLEDGE:
  - xcode-select --install opens a GUI dialog - useless for automation
  - Headless install requires a marker file trick with softwareupdate
  - No "upgrade" command - must uninstall and reinstall
  - Full Xcode.app includes CLT but at a different path
  - CLT version must match macOS version to avoid build failures

tags:
  - compiler
  - build-tools
  - xcode
  - clang
  - llvm
  - development
  - foundation
  - darwin
