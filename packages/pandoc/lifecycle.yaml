name: pandoc
version: "3.6"
description: Universal document converter with PDF support
homepage: https://pandoc.org
repository: https://github.com/jgm/pandoc
license: GPL-2.0-or-later
maintainer: Noble Factor

aliases:
  - document converter
  - markdown to pdf
  - markdown converter

signatures:
  brew: [pandoc]
  apt: [pandoc]
  dnf: [pandoc]
  pacman: [pandoc]
  choco: [pandoc]
  winget: [JohnMacFarlane.Pandoc]

platforms:
  - Darwin
  - Linux
  - Windows

features:
  pdf-latex:
    description: PDF output via LaTeX (best typography, ~500MB-4GB depending on distribution)
    default: false

  pdf-weasyprint:
    description: PDF output via WeasyPrint (simpler, CSS-based, ~100MB)
    default: false

  pdf-typst:
    description: PDF output via Typst (modern, fast, ~50MB)
    default: false

  completions:
    description: Install shell completions for bash/zsh/fish
    default: true

settings:
  latex_distribution:
    description: LaTeX distribution size (when pdf-latex enabled)
    type: string
    default: "basic"
    values: ["basic", "medium", "full"]

  paper:
    description: Default paper size for PDF output
    type: string
    default: "letter"
    values: ["letter", "a4", "legal"]

verification:
  command: "pandoc --version"
  pattern: "pandoc \\d+\\.\\d+"

notes: |
  INVISIBLE DEPENDENCIES:
  pandoc --pdf requires a PDF engine. Options:
  - LaTeX (pdf-latex): Best typography, large download
  - WeasyPrint (pdf-weasyprint): CSS-based, simpler
  - Typst (pdf-typst): Modern alternative, fast

tags:
  - document
  - converter
  - markdown
  - latex
  - pdf
  - writing
