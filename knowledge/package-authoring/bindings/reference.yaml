ns_descriptions:
    (root): Top-level graph construction primitives
    appnet: Network actions
    archive: Archive extraction actions
    elevator: Provider is the privilege-elevation provider (WORKING NAME)
    encryption: Encryption and decryption actions
    file: File system actions
    flow: Flow-control actions for execution graphs
    function: Actions over content-addressed function resources
    git: Git actions
    json: JSON encoding and decoding operations
    pkg: Provider is a thin veneer over the platform's Composite package-manager router
    plan: Provider creates graph nodes for plan-time graph construction
    platform: Provider exposes host platform metadata to Starlark scripts and graph actions
    powershell: PowerShell 7+ command execution
    regexp: Regular expression operations with compiled pattern caching
    service: Platform-agnostic service management
    shell: Shell command execution
    template: Template expansion actions
    ui: Provider exposes the [status.Narrator] capability to starlark
    yaml: YAML encoding and decoding operations
