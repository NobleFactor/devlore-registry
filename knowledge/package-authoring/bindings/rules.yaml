generator_rules:
    - action: Use plan.download(url, target) instead
      id: no-curl-wget
      rule: NEVER generate plan.shell() with curl or wget
    - action: Use plan.archive.extract(archive, target) instead
      id: no-tar-unzip
      rule: NEVER generate plan.shell() with tar, unzip, gunzip
    - action: Use plan.file.* methods instead
      id: no-file-ops
      rule: NEVER generate plan.shell() with rm, mkdir, cp, ln, cat, echo
    - action: Use plan.package.* methods instead
      id: no-pkg-managers
      rule: NEVER generate plan.shell() with apt, yum, dnf, brew, port, pacman
    - action: Use plan.git.* methods instead
      id: no-git
      rule: NEVER generate plan.shell() with git clone, git checkout, git pull
    - action: Use plan.service(name, action) instead
      id: no-service
      rule: NEVER generate plan.shell() with systemctl, service, launchctl
    - action: Include shell_audit section with all shell commands and their status
      id: audit-all-shell
      rule: For every plan.shell() in output, add to binding_proposals if pattern matches
    - action: Comment should state what binding would be needed
      id: document-necessary-shell
      rule: When plan.shell() is truly necessary, add comment explaining why
principles:
    - explanation: |
        A Darwin/Deploy/install.star and Linux/Deploy/install.star may have
        different implementations, but both should use the same API:
        - plan.download() not plan.shell("curl ...")
        - plan.package.install() not plan.shell("apt install ...")
        - plan.file.chmod() not plan.shell("chmod ...")
      id: one-api-many-platforms
      rule: Binding APIs are cross-platform. Steps may vary by platform, but API calls do not.
    - explanation: |
        Every plan.shell() call should be scrutinized:
        1. Is there an existing binding for this operation?
        2. If not, should there be?
        3. If shell is truly necessary, document why in a comment.

        When reviewing generated packages, shell usage is a code smell that
        indicates either:
        - Developer oversight (should use existing binding)
        - Binding gap (we need a new binding)
      id: shell-is-escape-hatch
      rule: plan.shell() is a last resort. Its use signals a potential binding gap.
    - explanation: |
        In the binding_proposals output, include an entry for each shell
        command that represents a common pattern. This creates a feedback
        loop where package generation identifies binding gaps.
      id: warn-on-shell
      rule: When plan.shell() is necessary, warn about it and propose a binding.
    - explanation: |
        Declarative methods:
        - Are type-safe and validated
        - Can be optimized by the execution engine
        - Have consistent error handling
        - Support dry-run introspection

        Shell commands:
        - Are opaque strings
        - Platform-specific
        - Error-prone
        - Hard to reason about
      id: prefer-declarative
      rule: Prefer declarative plan.* methods over imperative shell commands.
shell_antipatterns:
    - correct_binding: plan.download
      message: Use plan.download() instead of curl
      pattern: curl -.*-o
      severity: error
    - correct_binding: plan.download
      message: Use plan.download() instead of wget
      pattern: wget -O
      severity: error
    - correct_binding: plan.download
      message: Use plan.download() and plan.archive.extract() separately
      pattern: curl.*|.*tar
      severity: error
    - correct_binding: plan.file.remove
      message: Use plan.file.remove() instead of rm
      pattern: rm -rf?\s
      severity: error
    - correct_binding: plan.file.mkdir
      message: Use plan.file.mkdir() instead of mkdir
      pattern: mkdir -p
      severity: error
    - correct_binding: plan.file.copy
      message: Use plan.file.copy() instead of cp
      pattern: cp\s.*\s
      severity: error
    - correct_binding: plan.file.move
      message: Use plan.file.move() instead of mv
      pattern: mv\s.*\s
      proposed_binding:
        name: plan.file.move
        signature: 'move(source: string, target: string) -> node'
      severity: warning
    - correct_binding: plan.file.link
      message: Use plan.file.link() instead of ln -s
      pattern: ln -s
      severity: error
    - correct_binding: plan.file.chmod
      message: Use plan.file.chmod() instead of chmod
      pattern: chmod\s
      proposed_binding:
        name: plan.file.chmod
        signature: 'chmod(path: string, mode: string) -> node'
      severity: warning
    - correct_binding: plan.file.chown
      message: Use plan.file.chown() instead of chown
      pattern: chown\s
      proposed_binding:
        name: plan.file.chown
        signature: 'chown(path: string, owner: string, group: string = '''') -> node'
      severity: warning
    - correct_binding: plan.file.write
      message: Use plan.file.write() instead of cat/echo redirection
      pattern: cat\s.*>\s
      severity: error
    - correct_binding: plan.file.write
      message: Use plan.file.write() instead of echo redirection
      pattern: echo\s.*>\s
      severity: error
    - correct_binding: plan.file.edit
      message: Consider plan.file.edit() for in-place modifications
      pattern: sed -i
      proposed_binding:
        name: plan.file.edit
        signature: 'edit(path: string, pattern: string, replacement: string) -> node'
      severity: warning
    - correct_binding: plan.archive.extract
      message: Use plan.archive.extract() instead of tar
      pattern: tar\s.*-?[xz]
      severity: error
    - correct_binding: plan.archive.extract
      message: Use plan.archive.extract() instead of unzip
      pattern: unzip\s
      severity: error
    - correct_binding: plan.archive.extract
      message: Use plan.archive.extract() instead of gunzip
      pattern: gunzip\s
      severity: error
    - correct_binding: plan.git.clone
      message: Use plan.git.clone() instead of git clone
      pattern: git clone
      severity: error
    - correct_binding: plan.git.checkout
      message: Use plan.git.checkout() instead of git checkout
      pattern: git checkout
      severity: error
    - correct_binding: plan.git.pull
      message: Use plan.git.pull() instead of git pull
      pattern: git pull
      severity: error
    - correct_binding: plan.package.install
      message: Use plan.package.install() - it auto-detects package manager
      pattern: apt(-get)?\s+install
      severity: error
    - correct_binding: plan.package.install
      message: Use plan.package.install() - it auto-detects package manager
      pattern: yum\s+install
      severity: error
    - correct_binding: plan.package.install
      message: Use plan.package.install() - it auto-detects package manager
      pattern: dnf\s+install
      severity: error
    - correct_binding: plan.package.install
      message: Use plan.package.install() - it auto-detects package manager
      pattern: brew\s+install
      severity: error
    - correct_binding: plan.package.install
      message: Use plan.package.install() - it auto-detects package manager
      pattern: port\s+install
      severity: error
    - correct_binding: plan.package.install
      message: Use plan.package.install() - it auto-detects package manager
      pattern: pacman\s+-S
      severity: error
    - correct_binding: plan.package.install_pkg
      message: Consider plan.package.install_pkg() for .pkg installers
      pattern: installer\s+-pkg
      proposed_binding:
        name: plan.package.install_pkg
        platform: Darwin
        signature: 'install_pkg(path: string, target: string = ''/'') -> node'
      severity: warning
    - correct_binding: plan.package.forget_pkg
      message: Consider plan.package.forget_pkg() for package receipt removal
      pattern: pkgutil\s+--forget
      proposed_binding:
        name: plan.package.forget_pkg
        platform: Darwin
        signature: 'forget_pkg(identifier: string) -> node'
      severity: warning
    - correct_binding: plan.user.remove
      message: Consider plan.user.remove() or plan.group.remove()
      pattern: dscl\s+.*-delete
      proposed_binding:
        name: plan.user.remove
        signature: 'remove(name: string) -> node'
      severity: warning
    - correct_binding: plan.service
      message: Use plan.service() - it works across init systems
      pattern: systemctl\s+(start|stop|restart|enable|disable)
      severity: error
    - correct_binding: plan.service
      message: Use plan.service() - it works across init systems
      pattern: service\s+\w+\s+(start|stop|restart)
      severity: error
    - correct_binding: plan.service
      message: Use plan.service() - it works across init systems
      pattern: launchctl\s+(load|unload|start|stop)
      severity: error
    - correct_binding: plan.env.set
      message: Consider plan.env.set() for environment variables
      pattern: export\s+\w+=
      proposed_binding:
        name: plan.env.set
        signature: 'set(key: string, value: string, persist: bool = false) -> node'
      severity: warning
    - correct_binding: plan.build.configure
      message: Consider plan.build.configure() for autoconf builds
      pattern: \./configure
      proposed_binding:
        name: plan.build.configure
        signature: 'configure(dir: string, options: dict = {}) -> node'
      severity: info
    - correct_binding: plan.build.make
      message: Consider plan.build.make() for make builds
      pattern: make\s*(install)?$
      proposed_binding:
        name: plan.build.make
        signature: 'make(dir: string, target: string = '''', jobs: int = 0) -> node'
      severity: info
valid_shell_uses:
    - category: One-off commands
      description: Commands unique to a specific package with no general utility
      example: plan.shell('sudo /opt/local/bin/port selfupdate')
      note: Package-specific commands that don't generalize
    - category: Version checking
      description: Checking command output for version verification
      example: plan.shell('port version | grep -q {version}')
      note: Could be abstracted to plan.verify.command_output()
    - category: Complex pipelines
      description: Shell pipelines that combine multiple operations
      example: plan.shell('command | filter | transform')
      note: Break into discrete steps when possible
    - category: Interactive installers
      description: Installers that require specific flags or environment
      example: plan.shell('DEBIAN_FRONTEND=noninteractive apt-get install -y pkg')
      note: Package manager bindings should support these flags
version: "1.0"
