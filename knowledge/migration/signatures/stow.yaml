# GNU Stow dotfile manager signature
# https://www.gnu.org/software/stow/

name: stow
description: |
  GNU Stow organizes dotfiles in package directories at the repository root.
  Each package directory mirrors the home directory structure.
  .stow-local-ignore configures files to exclude from symlinking.

markers:
  # File-based signals
  - type: file
    path: ".stow-local-ignore"
    confidence: 1.0
    description: "Stow local ignore configuration"

  - type: file
    path: ".stow-global-ignore"
    confidence: 1.0
    description: "Stow global ignore configuration"

  - type: file
    path: ".stowrc"
    confidence: 0.95
    description: "Stow configuration file"

  # Structure-based signals
  - type: structure
    description: "Package directories with home-relative paths"
    example: |
      bash/
        .bashrc
        .bash_profile
      vim/
        .vimrc
        .vim/
      nvim/
        .config/
          nvim/
            init.lua
    confidence: 0.7

  # Script-based signals
  - type: script_content
    pattern: "stow "
    confidence: 0.9
    description: "Stow command in install script"

  - type: script_content
    pattern: "stow -v"
    confidence: 0.95
    description: "Verbose stow command"

  - type: script_content
    pattern: "stow -t ~"
    confidence: 0.95
    description: "Stow with home target"

  - type: script_content
    pattern: "stow --target"
    confidence: 0.9
    description: "Stow with explicit target"

  - type: script_content
    pattern: "stow -R"
    confidence: 0.9
    description: "Stow restow command"

  - type: script_content
    pattern: "stow -D"
    confidence: 0.9
    description: "Stow unstow command"

platform_support:
  notes: |
    GNU Stow has NO built-in platform variant support.
    Users who need platform variants typically:
    1. Use separate branches per machine
    2. Create manual packages like "bash-linux", "bash-macos"
    3. Use wrapper scripts with conditional logic
    4. Combine with other tools (like yadm) for platform selection

segment_transform:
  description: "Stow packages map to writ projects under Home/Configs/"
  from: "{package}/"
  to: "Home/Configs/{package}/"
  notes: |
    Stow packages are flat (no platform awareness). Migration may require
    manual separation of platform-specific files into separate segments.

encryption:
  notes: |
    Stow doesn't handle encryption. Secrets are typically stored separately
    or encrypted with external tools (GPG, git-crypt).
