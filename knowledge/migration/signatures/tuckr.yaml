# Tuckr dotfile manager signature
# https://github.com/RaphGL/Tuckr

name: tuckr
description: |
  Tuckr organizes dotfiles in a Configs/ directory with group subdirectories.
  Platform-specific groups use underscore suffixes (e.g., all_linux, all_macos).
  Hooks/ directory contains pre_<group>.sh and post_<group>.sh scripts.
  Secrets/ directory is for encrypted sensitive files (WIP feature).

markers:
  # Strong signals
  - type: directory
    path: "Configs/"
    confidence: 0.9
    description: "Main configuration directory (may also be at root)"

  - type: directory
    path: "Hooks/"
    confidence: 0.95
    description: "Hook scripts directory"

  - type: file
    path: "Hooks/pre_*.sh"
    confidence: 1.0
    description: "Pre-deployment hook script"

  - type: file
    path: "Hooks/post_*.sh"
    confidence: 1.0
    description: "Post-deployment hook script"

  - type: file
    path: "Hooks.toml"
    confidence: 0.9
    description: "Legacy hooks configuration file"

  # Platform variant patterns
  - type: directory_pattern
    pattern: "Configs/*_{linux,macos,darwin,windows,unix}"
    confidence: 0.95
    description: "Platform-specific group with underscore suffix"

  - type: directory_pattern
    pattern: "*_{linux,macos,darwin,windows,unix}"
    confidence: 0.85
    description: "Platform-specific group at root level"

  # Script signals
  - type: script_content
    pattern: "tuckr add"
    confidence: 1.0
    description: "Tuckr add command in install script"

  - type: script_content
    pattern: "tuckr set"
    confidence: 1.0
    description: "Tuckr set command in install script"

  - type: script_content
    pattern: "tuckr rm"
    confidence: 0.95
    description: "Tuckr remove command in install script"

segment_transform:
  description: |
    Tuckr uses underscore separators with lowercase platform names.
    Writ uses dot separators with capitalized platform names.
  from: "{name}_{platform}"
  to: "{name}.{Platform}"
  platform_mapping:
    linux: "Linux"
    macos: "Darwin"
    darwin: "Darwin"
    windows: "Windows"
    unix: "Unix"
  examples:
    - from: "all_linux"
      to: "all.Linux"
    - from: "all_macos"
      to: "all.Darwin"
    - from: "nvim_unix"
      to: "nvim.Unix"

special_features:
  environment_expansion:
    pattern: "%VARNAME"
    description: "Expands to environment variable value in paths"

  root_targeting:
    pattern: "^path/to/file"
    description: "Targets absolute paths outside $HOME (e.g., /etc/)"

encryption:
  notes: |
    Tuckr has a built-in Secrets/ directory for encrypted files (WIP).
    Users may also combine Tuckr with git-crypt or manual GPG encryption.
    Check .gitattributes for git-crypt patterns.
