name: macports
version: "2.11.6"
description: An easy to use system for compiling, installing, and managing open source software
homepage: https://www.macports.org/
repository: https://github.com/macports/macports-base
license: BSD-3-Clause

authors:
  - name: The MacPorts Project
    url: https://www.macports.org

platforms:
  - darwin

features:
  migration:
    description: Migrate ports when upgrading macOS versions
    default: false
  selfupdate:
    description: Keep MacPorts base and ports tree current
    default: true
  universal:
    description: Build universal binaries when possible
    default: false

settings:
  prefix:
    type: string
    default: "/opt/local"
    description: Installation prefix for MacPorts
  rsync_timeout:
    type: integer
    default: 30
    description: Timeout for rsync operations during selfupdate
  build_jobs:
    type: integer
    default: 0
    description: Number of parallel build jobs (0 = auto)

dependencies:
  - name: xcode-command-line-tools
    platform: darwin
    required: true

conflicts:
  - name: homebrew
    reason: "Both modify shell PATH and can interfere with builds"
  - name: fink
    reason: "Conflicting package management approaches"

phases:
  prepare: prepare.star
  install: install.star
  provision: provision.star
  verify: verify.star

verification:
  command: "port version"
  pattern: "Version: 2\.\d+\.\d+"

tags:
  - package-manager
  - build-system
  - macos
