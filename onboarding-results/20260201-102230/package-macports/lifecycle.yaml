name: macports
version: "2.11.6"
description: An easy-to-use system for compiling, installing, and upgrading either command-line, X11 or Aqua based open-source software on the Mac OS X operating system
homepage: https://www.macports.org/
repository: https://github.com/macports/macports-base
license: BSD-3-Clause

authors:
  - name: The MacPorts Project
    url: https://www.macports.org/

platforms:
  - Darwin

features:
  install-from-source:
    description: Install from source tarball instead of .pkg installer
    default: false
  install-from-git:
    description: Install from git repository (development version)
    default: false
  enable-readline:
    description: Enable readline support when building from source
    default: true

settings:
  prefix:
    type: string
    default: "/opt/local"
    description: Installation prefix (only affects source builds)
  macos-version:
    type: string
    default: "auto"
    description: Target macOS version for .pkg installer selection

dependencies:
  - name: xcode-command-line-tools
    required: true
    reason: Required for building ports from source

conflicts:
  - name: homebrew
    reason: Different installation prefixes can cause library conflicts
    severity: warning

verification:
  command: "port version"
  pattern: "Version: \\d+\\.\\d+\\.\\d+"

tags:
  - package-manager
  - macos
  - ports
  - source-builds
