name: Validate

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'
  push:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  validate:
    # The job name is the check context a ruleset must match, so it is written as an identifier
    # rather than a sentence: lowercase, hyphenated, no spaces. Matches `quality-gate` and the
    # `test (…)`/`scenario (…)` contexts in devlore-cli.
    name: validate-yaml-schemas
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore-cli

      # Order and nesting are both load-bearing. star resolves its extensions relative to the
      # working directory, so the commands must run from devlore-cli -- and fsroot confinement
      # refuses a target outside that directory, which is why a parent-relative target failed.
      # Checking this repository out INSIDE devlore-cli satisfies both at once: cwd finds the
      # extensions, and the target is in-tree. devlore-cli must be checked out first, or its
      # checkout would clean away the nested one.
      - name: Checkout devlore-cli
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/devlore-cli
          path: devlore-cli
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: devlore-cli/devlore-registry

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: devlore-cli/go.sum

      - name: Build star
        working-directory: devlore-cli
        run: go build -o ../star ./cmd/star

      - name: Validate package schemas
        working-directory: devlore-cli
        run: ../star devlore package validate --target=devlore-registry

      - name: Validate knowledge schemas
        working-directory: devlore-cli
        run: ../star devlore knowledge validate --target=devlore-registry
