name: Validate

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'
  push:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  validate:
    # The job name is the check context a ruleset must match, so it is written as an identifier
    # rather than a sentence: lowercase, hyphenated, no spaces. Matches `quality-gate` and the
    # `test (…)`/`scenario (…)` contexts in devlore-cli.
    name: validate-yaml-schemas
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: noblefactor-ops,devlore-cli

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout noblefactor-ops
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/noblefactor-ops
          path: noblefactor-ops
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout devlore-cli
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/devlore-cli
          path: devlore-cli
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: noblefactor-ops/go.sum

      - name: Build star
        working-directory: noblefactor-ops
        run: go build -o ../star ./cmd/star

      - name: Validate package schemas
        working-directory: devlore-cli
        run: ../star devlore package validate --target=..

      - name: Validate knowledge schemas
        working-directory: devlore-cli
        run: ../star devlore knowledge validate --target=..
