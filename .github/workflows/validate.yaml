name: Validate

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'
  push:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  validate:
    # One job per corpus, because they are different bodies of material with different schemas and
    # different owners: packages/ holds lore packages the devlore engine deploys, knowledge/ holds
    # the assets devlore-cli's knowledge-extract writes here for an LLM to consume. A single check
    # covering both said only that "something failed".
    #
    # The name is the check context a ruleset must match exactly, so it is an identifier rather than
    # a sentence. It also states the mechanism rather than the subject: the previous name,
    # validate-yaml-schemas, parses most naturally as "validate the YAML schemas" -- checking the
    # schemas themselves -- which is the opposite of what happens. JSON Schema is a proper noun, so
    # json-schema-validate cannot be re-parsed that way.
    name: json-schema-validate.${{ matrix.corpus }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { corpus: packages, command: package }
          - { corpus: knowledge, command: knowledge }
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore-cli

      # Order and nesting are both load-bearing. star resolves its extensions relative to the
      # working directory, so the commands must run from devlore-cli -- and fsroot confinement
      # refuses a target outside that directory, which is why a parent-relative target failed.
      # Checking this repository out INSIDE devlore-cli satisfies both at once: cwd finds the
      # extensions, and the target is in-tree. devlore-cli must be checked out first, or its
      # checkout would clean away the nested one.
      - name: Checkout devlore-cli
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/devlore-cli
          path: devlore-cli
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: devlore-cli/devlore-registry

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: devlore-cli/go.sum

      - name: Build star
        working-directory: devlore-cli
        run: go build -o ../star ./cmd/star

      - name: Validate
        working-directory: devlore-cli
        run: ../star devlore ${{ matrix.command }} validate --target=devlore-registry

      # The steps a job that signs in with NobleFactor's GitHub App ends with (noblefactor-engprod#613). When the job
      # fails, they check the App's token at once, and that it reaches every repository TOKEN_CHECK_TARGETS names: a bad
      # one raises its alert, naming the workflow and its run; one that checks fine raises nothing, the failure being
      # the job's own. The check is fetched into a folder of its own, leaving the job's working tree as it is. The job's
      # own token needs issues: write and contents: read. They run only where the run can read the repository's secrets:
      # never for Dependabot, on any event, and never on a pull request from a fork, whose runs get none, so that such a
      # failure raises no false alert. They are noblefactor-engprod's
      # workflow-templates/credentials-check.app-failure-steps.yml, as landed by NobleFactor/noblefactor-engprod#613's
      # plan § 5.15.
      - uses: actions/checkout@v4
        if: >-
          failure() && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sparse-checkout: .github/credentials-check
          path: .credentials-check
      - name: Report a failure the App's token may have caused
        if: >-
          failure() && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CHECKS: app
          MODE: report
          KIND: organization
          ACCOUNT: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          TARGETS: ${{ vars.TOKEN_CHECK_TARGETS }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .credentials-check/.github/credentials-check/credentials-check.sh || true
