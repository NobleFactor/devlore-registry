name: Validate

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/**'
      - 'knowledge/**'
      - 'schemas/**'
      - 'signatures.yaml'
  push:
    branches: [develop]
    paths:
      - 'packages/**'
      - 'knowledge/**'
      - 'schemas/**'
      - 'signatures.yaml'

jobs:
  validate:
    name: Validate YAML schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Configure private Go modules
        run: git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: github.com/NobleFactor/*

      - name: Install star
        run: go install github.com/NobleFactor/noblefactor-ops/cmd/star@latest
        env:
          GOPRIVATE: github.com/NobleFactor/*

      - name: Validate all schemas
        run: star registry validate
