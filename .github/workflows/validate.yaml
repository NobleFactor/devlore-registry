name: Validate

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'
  push:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  validate:
    # One job per corpus, because they are different bodies of material with different schemas and
    # different owners: packages/ holds lore packages the devlore engine deploys, knowledge/ holds
    # the assets devlore-cli's knowledge-extract writes here for an LLM to consume. A single check
    # covering both said only that "something failed".
    #
    # The name is the check context a ruleset must match exactly, so it is an identifier rather than
    # a sentence. It also states the mechanism rather than the subject: the previous name,
    # validate-yaml-schemas, parses most naturally as "validate the YAML schemas" -- checking the
    # schemas themselves -- which is the opposite of what happens. JSON Schema is a proper noun, so
    # json-schema-validate cannot be re-parsed that way.
    name: json-schema-validate.${{ matrix.corpus }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { corpus: packages, command: package }
          - { corpus: knowledge, command: knowledge }
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore-cli

      # Order and nesting are both load-bearing. star resolves its extensions relative to the
      # working directory, so the commands must run from devlore-cli -- and fsroot confinement
      # refuses a target outside that directory, which is why a parent-relative target failed.
      # Checking this repository out INSIDE devlore-cli satisfies both at once: cwd finds the
      # extensions, and the target is in-tree. devlore-cli must be checked out first, or its
      # checkout would clean away the nested one.
      - name: Checkout devlore-cli
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/devlore-cli
          path: devlore-cli
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: devlore-cli/devlore-registry

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: devlore-cli/go.sum

      - name: Build star
        working-directory: devlore-cli
        run: go build -o ../star ./cmd/star

      - name: Validate
        working-directory: devlore-cli
        run: ../star devlore ${{ matrix.command }} validate --target=devlore-registry
