name: Build Signatures

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'
    paths:
      - 'packages/**/lifecycle.yaml'

jobs:
  build-signatures:
    name: Build signatures.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install star
        run: go install github.com/NobleFactor/noblefactor-ops/cmd/star@latest

      - name: Build signatures.yaml
        run: star registry build-signatures

      - name: Commit signatures.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signatures.yaml
          if git diff --staged --quiet; then
            echo "No changes to signatures.yaml"
          else
            git commit -m "chore: rebuild signatures.yaml"
            git push
          fi
