name: Update indexes

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  update-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore-registry,devlore-cli

      # See validate.yaml: this repository is checked out inside devlore-cli so that star finds its
      # extensions via the working directory while the target stays inside the confinement root.
      # devlore-cli first, or its checkout cleans away the nested one.
      - name: Checkout devlore-cli
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/devlore-cli
          path: devlore-cli
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout devlore-registry
        uses: actions/checkout@v4
        with:
          path: devlore-cli/devlore-registry
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: devlore-cli/go.sum

      - name: Build star
        working-directory: devlore-cli
        run: go build -o ../star ./cmd/star

      - name: Update package index
        working-directory: devlore-cli
        run: ../star devlore package index --target=devlore-registry

      # Re-enabled. It was disabled after devlore-registry#80, when this step rebuilt each domain's
      # index.yaml from a directory listing and deleted the curated metadata it found. devlore-cli#719
      # replaced that behaviour: entries are merged rather than rebuilt, and anything the indexer
      # cannot classify is an error rather than an omission -- an unknown section, a section without
      # a directory, a directory with assets and no section, an indexed file that is absent, or an
      # entry that does not declare whether it is generated.
      #
      # So a failure here now means the tree and its indexes disagree, and someone has to say which
      # is right. That is the intended behaviour; it is not a reason to disable the step again.
      - name: Update knowledge indexes
        working-directory: devlore-cli
        run: ../star devlore knowledge index --target=devlore-registry

      # Open a pull request rather than pushing. The push went straight into the protected branch
      # that triggered this run, which organization ruleset 12426847 now refuses for everyone --
      # there are no bypass actors for a direct push. That was #75.
      #
      # The branch name has to satisfy the branch-name ruleset (12515090), which became actively
      # enforced on 2026-08-27: ^(chore|doc|feature|fix|hotfix|refactor|release)/.+$. A bare
      # `update-indexes-<sha>` would be refused at push, so the prefix is not cosmetic.
      #
      # The merge carries no --admin. The NobleFactor Automation app is a bypass actor on the org
      # ruleset but NOT on this repository's 21604093, so a red quality-gate or
      # validate-yaml-schemas refuses this merge server-side. That is deliberate: regenerated
      # indexes should not land over a failing gate.
      - name: Open index-update PR
        working-directory: devlore-cli/devlore-registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generated files are gitignored, hence -f.
          git add -f packages/index.yaml packages/cross-reference.yaml knowledge/*/index.yaml 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No index changes to commit"
            exit 0
          fi

          BRANCH="chore/update-indexes-${GITHUB_SHA::7}"
          git checkout -b "$BRANCH"
          git commit -m "chore: update indexes from ${GITHUB_SHA::7}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore: update indexes from ${GITHUB_SHA::7}" \
            --body "Regenerated package and knowledge indexes for [\`${GITHUB_SHA::7}\`](https://github.com/NobleFactor/devlore-registry/commit/${GITHUB_SHA})." \
            --base "${{ github.ref_name }}")
          echo "Created PR: $PR_URL"

          # --admin is entitlement the app actually holds, not a way around a failing gate. Two
          # rulesets apply and only one of them is bypassable here:
          #
          #   org 12426847   requires an approving review; the NobleFactor Automation app IS a
          #                  bypass actor, in pull_request mode
          #   repo 21604093  requires quality-gate and validate-yaml-schemas; the app is NOT a
          #                  bypass actor, so a red check refuses this merge server-side
          #
          # Without the flag, gh's client-side veto refuses on REVIEW_REQUIRED before the server is
          # ever asked -- and no human is going to review a machine-generated index update, so every
          # PR this workflow opened was left green and stranded. Four accumulated in two days
          # (#83, #85, #87, and the branch behind #80).
          #
          # --auto is not the alternative: allow_auto_merge is false on this repository, and even
          # enabled it would queue behind a review that will never arrive. require_last_push_approval
          # is true, so the app cannot approve its own push either.
          #
          # Bounded retry: a transient 5xx must not strand a green PR, and a failed attempt may still
          # have merged server-side, so the PR state is consulted before retrying.
          merged=false
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --squash --admin --delete-branch; then
              merged=true
              break
            fi
            state=$(gh pr view "$PR_URL" --json state --jq .state || echo UNKNOWN)
            if [ "$state" = "MERGED" ]; then
              echo "merge attempt $attempt reported failure but the PR is merged"
              merged=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "merge attempt $attempt failed (state: $state); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done

          if [ "$merged" != true ]; then
            echo "Could not merge $PR_URL. It is open with the indexes on it; the checks explain why."
            exit 1
          fi
