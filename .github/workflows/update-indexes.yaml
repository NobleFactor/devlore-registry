name: Update indexes

on:
  push:
    branches: [develop]
    paths:
      - 'packages/**/lifecycle.yaml'
      - 'knowledge/**/*.md'
      - 'knowledge/**/*.yaml'

jobs:
  update-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore-registry,noblefactor-ops

      - name: Checkout devlore-registry
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout noblefactor-ops
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/noblefactor-ops
          path: noblefactor-ops
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: noblefactor-ops/go.sum

      - name: Build star
        working-directory: noblefactor-ops
        run: go build -o star ./cmd/star

      - name: Update package index
        run: ./noblefactor-ops/star devlore-registry index packages --path .

      - name: Update knowledge indexes
        run: ./noblefactor-ops/star devlore-registry index knowledge --path .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add ignored generated files
          git add -f packages/index.yaml packages/cross-reference.yaml knowledge/*/index.yaml 2>/dev/null || true

          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No index changes to commit"
          else
            git commit -m "chore: update indexes"
            git push
          fi
