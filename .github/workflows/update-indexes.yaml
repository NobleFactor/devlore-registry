name: Update indexes

on:
  push:
    branches: [develop]
    paths:
      - 'packages/**/lifecycle.yaml'
      - 'knowledge/**/*.md'
      - 'knowledge/**/*.yaml'

jobs:
  update-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devlore-registry
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.NOBLEFACTOR_REPOSITORY_ACCESS }}

      - name: Checkout noblefactor-ops
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/noblefactor-ops
          path: noblefactor-ops
          token: ${{ secrets.NOBLEFACTOR_REPOSITORY_ACCESS }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Update package index
        run: go run ./noblefactor-ops/cmd/star registry index-packages --path .

      - name: Update knowledge indexes
        run: go run ./noblefactor-ops/cmd/star registry index-knowledge --path .

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update indexes"
          file_pattern: "packages/INDEX.yaml knowledge/*/index.yaml"
